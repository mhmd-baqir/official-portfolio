<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سوبرماركت النور الإلكتروني | تسوق مباشر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #08120e; --card: #102119; --border: rgba(255,255,255,0.08); --text: #f1f5f9; --muted: #94a3b8; --green: #10b981; --amber: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .topbar { background: rgba(16,33,25,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0.85rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
    .top-actions { display: flex; align-items: center; gap: 0.75rem; }
    .cart-btn { padding: 0.5rem 1rem; border-radius: 99px; background: var(--green); color: #052e16; border: none; font-family: inherit; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; }
    .back-btn { padding: 0.45rem 1rem; border-radius: 99px; background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); text-decoration: none; font-weight: 700; font-size: 0.85rem; }
    .container { max-width: 1180px; margin: 0 auto; padding: 1.5rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .search-inp { flex: 1; min-width: 240px; padding: 0.7rem 1rem; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit; }
    .cats { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .cat-btn { padding: 0.45rem 1rem; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; font-family: inherit; font-weight: 700; }
    .cat-btn.active { background: var(--green); color: #052e16; border-color: var(--green); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.25rem; }
    .prod-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .prod-emoji { font-size: 3rem; text-align: center; padding: 1rem; background: rgba(255,255,255,0.03); border-radius: 12px; }
    .prod-title { font-weight: 800; font-size: 1.05rem; }
    .prod-price { font-weight: 900; color: var(--green); font-size: 1.15rem; }
    .add-btn { width: 100%; padding: 0.6rem; border-radius: 10px; border: none; background: rgba(16,185,129,0.18); color: var(--green); font-family: inherit; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .add-btn:hover { background: var(--green); color: #052e16; }
    /* Cart Drawer */
    .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; justify-content: flex-end; z-index: 100; }
    .drawer-bg.open { display: flex; }
    .drawer { width: 100%; max-width: 390px; background: var(--card); height: 100%; padding: 1.5rem; display: flex; flex-direction: column; }
    .drawer-items { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.85rem; margin: 1rem 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 0.75rem; border-radius: 10px; }
    .qty-ctrl { display: flex; align-items: center; gap: 0.5rem; }
    .qty-ctrl button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
    .coupon-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .coupon-row input { flex: 1; padding: 0.55rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <span style="font-size:1.5rem;">🛒</span>
      <div>
        <div style="font-weight:800;">سوبرماركت النور الإلكتروني</div>
        <div style="font-size:0.75rem;color:var(--muted);">PHP + MySQL + AJAX Cart • كوبون خصم: SAVE15</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="cart-btn" onclick="openCart()">🛍️ السلة (<span id="cartCount">0</span>)</button>
      <a href="../../index.html" class="back-btn">← البورتفوليو</a>
    </div>
  </header>

  <div class="container">
    <div class="toolbar">
      <input class="search-inp" id="searchBox" placeholder="ابحث عن منتج..." oninput="renderProducts()" />
      <div class="cats">
        <button class="cat-btn active" onclick="setCat('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="setCat('فواكه وخضار', this)">فواكه وخضار</button>
        <button class="cat-btn" onclick="setCat('ألبان ومخبوزات', this)">ألبان ومخبوزات</button>
        <button class="cat-btn" onclick="setCat('مشروبات', this)">مشروبات</button>
      </div>
    </div>

    <div class="grid" id="prodGrid"></div>
  </div>

  <div class="drawer-bg" id="cartDrawer" onclick="if(event.target===this) closeCart()">
    <div class="drawer">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:1rem;">
        <h3>سلة التسوق</h3>
        <button onclick="closeCart()" style="background:none;border:none;color:var(--text);font-size:1.25rem;cursor:pointer;">✕</button>
      </div>
      <div class="drawer-items" id="cartItems"></div>
      <div style="border-top:1px solid var(--border);padding-top:1rem;">
        <div class="coupon-row">
          <input id="couponInput" placeholder="كود الخصم (جرّب SAVE15)" />
          <button onclick="applyCoupon()" style="padding:0 1rem;border-radius:8px;border:none;background:var(--amber);color:#000;font-weight:800;cursor:pointer;">تطبيق</button>
        </div>
        <div style="display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;margin-bottom:1rem;">
          <span>الإجمالي:</span>
          <span id="cartTotal" style="color:var(--green);">0 د.ع</span>
        </div>
        <button class="add-btn" style="background:var(--green);color:#052e16;padding:0.85rem;" onclick="checkout()">إتمام الطلب الآن ✔</button>
      </div>
    </div>
  </div>

  <script>
    const PRODUCTS = [
      { id: 1, name: "تفاح أحمر طازج (1 كغم)", cat: "فواكه وخضار", price: 2500, emoji: "🍎" },
      { id: 2, name: "موز مستورد (1 كغم)", cat: "فواكه وخضار", price: 2000, emoji: "🍌" },
      { id: 3, name: "حليب طازج كامل الدسم", cat: "ألبان ومخبوزات", price: 1750, emoji: "🥛" },
      { id: 4, name: "خبز فرنسي طازج", cat: "ألبان ومخبوزات", price: 1000, emoji: "🥖" },
      { id: 5, name: "عصير برتقال طبيعي", cat: "مشروبات", price: 1500, emoji: "🧃" },
      { id: 6, name: "جبن أبيض كريمي", cat: "ألبان ومخبوزات", price: 3500, emoji: "🧀" },
      { id: 7, name: "طماطم عضوية (1 كغم)", cat: "فواكه وخضار", price: 1250, emoji: "🍅" },
      { id: 8, name: "قهوة عربية محمصة", cat: "مشروبات", price: 6000, emoji: "☕" }
    ];

    let activeCat = 'الكل';
    let cart = JSON.parse(localStorage.getItem('mb_cart')) || [];
    let discount = 0;

    function setCat(c, btn) {
      activeCat = c;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function renderProducts() {
      const q = document.getElementById('searchBox').value.trim().toLowerCase();
      const grid = document.getElementById('prodGrid');
      grid.innerHTML = '';
      PRODUCTS.filter(p => (activeCat === 'الكل' || p.cat === activeCat) && p.name.toLowerCase().includes(q))
        .forEach(p => {
          const card = document.createElement('div');
          card.className = 'prod-card';
          card.innerHTML = `
            <div class="prod-emoji">${p.emoji}</div>
            <div style="font-size:0.75rem;color:var(--muted);">${p.cat}</div>
            <div class="prod-title">${p.name}</div>
            <div class="prod-price">${p.price.toLocaleString()} د.ع</div>
            <button class="add-btn" onclick="addToCart(${p.id})">+ أضف للسلة</button>
          `;
          grid.appendChild(card);
        });
    }

    function addToCart(id) {
      const item = cart.find(x => x.id === id);
      if (item) item.qty++;
      else {
        const p = PRODUCTS.find(x => x.id === id);
        cart.push({ ...p, qty: 1 });
      }
      updateCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(x => x.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
      updateCart();
    }

    function updateCart() {
      localStorage.setItem('mb_cart', JSON.stringify(cart));
      document.getElementById('cartCount').textContent = cart.reduce((s, x) => s + x.qty, 0);
      const container = document.getElementById('cartItems');
      container.innerHTML = cart.length === 0 ? '<p style="text-align:center;color:var(--muted);margin-top:2rem;">السلة فارغة حالياً</p>' : '';
      let sub = 0;
      cart.forEach(x => {
        sub += x.price * x.qty;
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML = `
          <div>
            <div style="font-weight:700;font-size:0.9rem;">${x.emoji} ${x.name}</div>
            <div style="font-size:0.8rem;color:var(--green);">${(x.price * x.qty).toLocaleString()} د.ع</div>
          </div>
          <div class="qty-ctrl">
            <button onclick="changeQty(${x.id}, -1)">-</button>
            <span>${x.qty}</span>
            <button onclick="changeQty(${x.id}, 1)">+</button>
          </div>
        `;
        container.appendChild(row);
      });
      const total = Math.round(sub * (1 - discount));
      document.getElementById('cartTotal').textContent = total.toLocaleString() + ' د.ع' + (discount > 0 ? ' (خصم 15%)' : '');
    }

    function applyCoupon() {
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      if (code === 'SAVE15' || code === 'IRAQ10') {
        discount = 0.15;
        alert('تم تفعيل خصم 15% بنجاح!');
      } else {
        discount = 0;
        alert('كود غير صحيح، جرّب SAVE15');
      }
      updateCart();
    }

    function checkout() {
      if (cart.length === 0) return alert('أضف منتجات للسلة أولاً!');
      alert('🎉 تم استلام طلبك بنجاح! رقم الطلب #' + Math.floor(1000 + Math.random() * 9000));
      cart = [];
      discount = 0;
      updateCart();
      closeCart();
    }

    function openCart() { document.getElementById('cartDrawer').classList.add('open'); }
    function closeCart() { document.getElementById('cartDrawer').classList.remove('open'); }

    renderProducts();
    updateCart();
  </script>
</body>
</html>
